<html lang="es">
    <link href="style.css" rel="stylesheet" />
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym log</title>
</head>
<body>
    <h1>Gym Logs</h1>
    <input id="nuevoEjercicio" placeholder="Nuevo ejercicio">
    <button id="agregarEjercicio">Agregar ejercicio</button>
    <select id="ejercicio"></select>
    <input id="reps" type="number" placeholder="Reps">
    <input id="peso" type="number" placeholder="Peso (Kg)">
    <button id="guardar">Guardar Serie</button>
    <ul id="lista"></ul>
<script>
    const inputNuevoEjercicio = document.getElementById('nuevoEjercicio');
    const botonAgregar = document.getElementById('agregarEjercicio');
    const inputEjercicio = document.getElementById('ejercicio');
    const inputReps = document.getElementById('reps');
    const inputPeso = document.getElementById('peso');
    const boton = document.getElementById("guardar");
    const lista = document.getElementById('lista');
    const CLAVE = 'series';
    const ejercicios = JSON.parse(localStorage.getItem('ejercicios')) || ['Press banca', 'Sentadilla', 'Peso muerto'];
    const series = JSON.parse(localStorage.getItem(CLAVE)) || [];
    boton.addEventListener('click', function () {
        
        const serie = {
            ejercicio: inputEjercicio.value,
            reps: Number(inputReps.value),
            peso: Number(inputPeso.value),
            fecha: new Date().toLocaleDateString(),
        };

        series.push(serie);
        guardarSeries();
        mostrarSeries();
    });

    function mostrarEjercicios(){
        inputEjercicio.innerHTML = '';
        
        for (const nombre of ejercicios) {
            const opcion = document.createElement('option');
            opcion.textContent = nombre;
            inputEjercicio.appendChild(opcion)
        }
    }
        
    botonAgregar.addEventListener('click', function () {
        const nombre = inputNuevoEjercicio.value.trim();
        if (nombre) {
            if (ejercicios.includes(nombre)) {
                alert('Este ejercicio ya existe');
            } else {
                ejercicios.push(nombre);
                guardarEjercicios();
                mostrarEjercicios();
            }
        }
    });

    function guardarEjercicios (){
        localStorage.setItem('ejercicios', JSON.stringify(ejercicios));
    }
    function mostrarSeries(){
        lista.innerHTML = '';

        for (const serie of series) {
            const item = document.createElement('li');
            let texto = serie.ejercicio + ': ' + serie.peso + ' kg x ' +  serie.reps;
            if (serie.fecha) {
                texto = texto + ' (' + serie.fecha + ')'
            }
            item.textContent = texto
            const botonBorrar = document.createElement('button')
            botonBorrar.textContent = 'Borrar';
            item.appendChild(botonBorrar)

            botonBorrar.addEventListener('click', function () {
                const posicion = series.indexOf(serie);
                series.splice(posicion, 1);
                guardarSeries();
                mostrarSeries();
            });
            lista.appendChild(item)

        }
    }
    
    function guardarSeries() {
        localStorage.setItem(CLAVE, JSON.stringify(series));
    }
    mostrarEjercicios();
    mostrarSeries();

</script>
</body>
</html>
